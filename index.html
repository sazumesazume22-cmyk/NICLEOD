<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICLEOD | Online Shop</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #181b20;
            --text: #ffffff;
            --muted: #9ca3af;
            --accent: #3b82f6;
            --border: #2a2f3a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

        /* Header */
        header {
            background: rgba(15, 17, 21, 0.9);
            backdrop-filter: blur(10px);
            padding: 18px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: 3px; }
        .cart-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        /* Section Title */
        .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
        .section-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 20px;
            padding-left: 12px;
            border-left: 4px solid var(--accent);
            text-transform: uppercase;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 16px;
        }
        @media (min-width: 600px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .card-img-wrap {
            width: 100%;
            height: 230px;
            background: #13161c;
            overflow: hidden;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-body {
            padding: 14px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 8px;
            color: var(--text);
        }
        .card-price {
            font-size: 16px;
            font-weight: 800;
            color: #60a5fa;
            margin-bottom: 10px;
        }
        .size-select {
            width: 100%;
            background: #22262e;
            color: #fff;
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .add-btn {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        #loading { text-align: center; padding: 40px; color: var(--muted); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
        }
        @media (min-width: 600px) { .modal { align-items: center; } }
        .modal-content {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            width: 100%;
            max-width: 460px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }
        @media (min-width: 600px) { .modal-content { border-radius: 16px; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 26px; cursor: pointer; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
        .remove-btn { color: #f87171; background: none; border: none; cursor: pointer; font-size: 12px; }
        .payment-box {
            background: #22262e;
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 13px;
            line-height: 1.6;
        }
        .input-group { margin-bottom: 10px; }
        .input-group input {
            width: 100%;
            background: #13161c;
            color: #fff;
            padding: 11px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }
        .order-btn {
            width: 100%;
            background: #0084ff;
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">NICLEOD</div>
    <button class="cart-btn" onclick="openCart()">Сагс (<span id="cart-count">0</span>)</button>
</header>

<div class="container">
    <div class="section-title">ШИНЭ ЗАГВАРУУД</div>
    <div id="loading">Бараануудыг ачаалж байна...</div>
    <div class="grid" id="product-grid"></div>
</div>

<div class="modal" id="cart-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Таны сагс</h3>
            <button class="close-btn" onclick="closeCart()">&times;</button>
        </div>
        <div id="cart-items"></div>
        <div style="margin-top: 15px; font-weight: 800; font-size: 16px; display: flex; justify-content: space-between;">
            <span>Нийт дүн:</span>
            <span id="cart-total">0 ₮</span>
        </div>

        <div class="payment-box">
            <strong>💳 Төлбөр шилжүүлэх данс:</strong><br>
            Банк: <b>Хаан Банк</b><br>
            Данс: <b>5000000000</b><br>
            Нэр: <b>Таны Нэр</b><br>
            <span style="color:#9ca3af; font-size:12px;">Гүйлгээний утга дээр утасны дугаараа бичнэ үү.</span>
        </div>

        <div class="input-group">
            <input type="text" id="cust-phone" placeholder="Таны утасны дугаар">
        </div>
        <div class="input-group">
            <input type="text" id="cust-address" placeholder="Хүргүүлэх хаяг">
        </div>

        <button class="order-btn" onclick="sendOrder()">Захиалгыг хуулж Messenger рүү орох</button>
    </div>
</div>

<script>
    const SHEET_URL = "https://google.com";
    const MESSENGER_LINK = "https://m.me";

    let products = [];
    let cart = [];

    async function loadProducts() {
        try {
            const response = await fetch(SHEET_URL + "&t=" + new Date().getTime());
            const data = await response.text();
            const rows = data.split(/\r?\n/).slice(1);
            
            const grid = document.getElementById("product-grid");
            grid.innerHTML = "";
            document.getElementById("loading").style.display = "none";

            rows.forEach((row, index) => {
                if (!row.trim()) return;
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(col => col.replace(/^"|"$/g, '').trim());
                
                if (cols.length >= 2 && cols !== "") {
                    const name = cols;
                    const priceText = cols;
                    const priceNum = parseInt(priceText.replace(/[^0-9]/g, '')) || 0;
                    const sizes = cols ? cols.split(",") : ["Free size"];
                    let image = cols || "";

                    // Хэрэв линк биш зүгээр зурагны нэр бичсэн бол (жишээ нь: 1.jpg эсвэл IMG_0312.jpeg) GitHub-аас шууд татна
                    if (!image) {
                        image = "https://placeholder.com";
                    } else if (!image.startsWith("http") && !image.includes(".")) {
                        image = image + ".jpg";
                    }

                    products.push({ id: index, name, priceText, priceNum, sizes, image });

                    let sizeOptions = sizes.map(s => `<option value="${s.trim()}">${s.trim()}</option>`).join("");

                    grid.innerHTML += `
                        <div class="card">
                            <div class="card-img-wrap">
                                <img src="${image}" alt="${name}" onerror="this.src='https://placeholder.com'">
                            </div>
                            <div class="card-body">
                                <div>
                                    <div class="card-title">${name}</div>
                                    <div class="card-price">${priceText} ₮</div>
                                    <select class="size-select" id="size-${index}">
